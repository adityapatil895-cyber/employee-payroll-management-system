<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Employee Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-5">
  <h3>👤 Welcome, <span th:text="${employee != null ? employee.name : 'Employee'}"></span></h3>

  <!-- Message after clock in/out -->
  <div th:if="${message}" class="alert alert-info mt-3">
    <span th:text="${message}"></span>
  </div>

  <!-- Clock In / Clock Out buttons -->
  <div class="row mt-3 mb-3">
    <div class="col-md-6">
      <form th:action="@{/employee/clockin}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-success w-100 p-3">
          🟢 Clock In
        </button>
      </form>
    </div>
    <div class="col-md-6">
      <form th:action="@{/employee/clockout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger w-100 p-3">
          🔴 Clock Out
        </button>
      </form>
    </div>
  </div>

  <!-- Navigation buttons -->
  <div class="row mt-2 g-3">
    <div class="col-md-4">
      <a href="/employee/payslip" class="btn btn-outline-warning w-100 p-3"> My Payslip </a>
    </div>
    <div class="col-md-4">
      <a href="/employee/attendance" class="btn btn-outline-primary w-100 p-3"> My Attendance </a>
    </div>
    <div class="col-md-4">
      <a href="/logout" class="btn btn-outline-danger w-100 p-3"> Logout </a>
    </div>
  </div>
</div>
</body>
</html>
