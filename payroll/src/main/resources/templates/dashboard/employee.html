<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Employee Dashboard</title>
  <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
  <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

  <div th:replace="fragments/navbar :: sidebar"></div>

  <div id="content-wrapper" class="d-flex flex-column">
    <div id="content">

      <div th:replace="fragments/navbar :: topbar"></div>

      <div class="container-fluid">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
          <h1 class="h3 mb-0 text-gray-800">
             Welcome, <span th:text="${employee != null ? employee.name : 'Employee'}"></span>
          </h1>
        </div>


        <div th:if="${message}" class="alert alert-info alert-dismissible fade show">
          <span th:text="${message}"></span>
          <button type="button" class="close" data-dismiss="alert">
            <span>&times;</span>
          </button>
        </div>


        <div class="row mb-4">
          <div class="col-md-6">
            <div class="card border-left-success shadow h-100 py-2">
              <div class="card-body text-center">
                <h5 class="font-weight-bold text-success mb-3">
                  <i class="fas fa-sign-in-alt mr-2"></i>Clock In
                </h5>
                <form th:action="@{/employee/clockin}" method="post">
                  <input type="hidden"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-success btn-lg btn-block">
                    🟢 Clock In
                  </button>
                </form>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card border-left-danger shadow h-100 py-2">
              <div class="card-body text-center">
                <h5 class="font-weight-bold text-danger mb-3">
                  <i class="fas fa-sign-out-alt mr-2"></i>Clock Out
                </h5>
                <form th:action="@{/employee/clockout}" method="post">
                  <input type="hidden"
                         th:name="${_csrf.parameterName}"
                         th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-lg btn-block">
                    🔴 Clock Out
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>


        <div class="row">
          <div class="col-md-6 mb-4">
            <div class="card shadow">
              <div class="card-body text-center">
                <i class="fas fa-calendar-check fa-3x text-primary mb-3"></i>
                <h5>My Attendance</h5>
                <p class="text-muted">View your monthly attendance records</p>
                <a href="/employee/attendance" class="btn btn-primary btn-block">
                  View Attendance
                </a>
              </div>
            </div>
          </div>
          <div class="col-md-6 mb-4">
            <div class="card shadow">
              <div class="card-body text-center">
                <i class="fas fa-file-invoice-dollar fa-3x text-warning mb-3"></i>
                <h5>My Payslip</h5>
                <p class="text-muted">View and download your payslip</p>
                <a href="/employee/payslip" class="btn btn-warning btn-block">
                  View Payslip
                </a>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
