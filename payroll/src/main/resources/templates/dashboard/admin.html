<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container mt-4">
  <h3> Admin Dashboard — Welcome, <span th:text="${username}"></span></h3>
  <hr/>

  <!-- Count Cards -->
  <div class="row mt-3 g-3">

    <div class="col-md-4">
      <div class="card text-white bg-primary p-3 text-center shadow">
        <h5>👥 Total Employees</h5>
        <h2 th:text="${totalEmployees}">0</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-white bg-success p-3 text-center shadow">
        <h5>💰 Total Payroll</h5>
        <h2>₹<span th:text="${totalPayroll}">0</span></h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card text-white bg-warning p-3 text-center shadow">
        <h5>🗓️ Monthly Attendance</h5>
        <h2 th:text="${monthlyAttendance}">0</h2>
      </div>
    </div>

  </div>

  <!-- Action Buttons -->
  <div class="row mt-4 g-3">
    <div class="col-md-3">
      <a href="/employees" class="btn btn-outline-primary w-100 p-3">👥 Manage Employees</a>
    </div>
    <div class="col-md-3">
      <a href="/attendance" class="btn btn-outline-success w-100 p-3">🕐 Attendance</a>
    </div>
    <div class="col-md-3">
      <a href="/payroll" class="btn btn-outline-warning w-100 p-3">💰 Payroll</a>
    </div>
    <div class="col-md-3">
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-danger w-100 p-3">🚪 Logout</button>
      </form>
    </div>
  </div>

</div>
</body>
</html>
