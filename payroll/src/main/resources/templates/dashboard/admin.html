<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-5">
  <h3> Admin Dashboard — Welcome, <span th:text="${username}"></span></h3>
  <div class="row mt-4 g-3">
    <div class="col-md-3"><a href="/employees" class="btn btn-outline-primary w-100 p-3">👥 Employees</a></div>
    <div class="col-md-3"><a href="/attendance" class="btn btn-outline-success w-100 p-3">🕐 Attendance</a></div>
    <div class="col-md-3"><a href="/payroll" class="btn btn-outline-warning w-100 p-3">💰 Payroll</a></div>
    <div class="col-md-3">
      <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" class="btn btn-outline-danger w-100 p-3">
          🚪 Logout
        </button>
      </form>
    </div>
    </div>
</div>
</body>
</html>
