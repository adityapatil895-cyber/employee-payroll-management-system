<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>HR Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container mt-4">
  <h3> HR Dashboard — Welcome, <span th:text="${username}"></span></h3>
  <hr/>

  <!-- Summary Cards -->
  <div class="row mt-3 g-3">
    <div class="col-md-4">
      <div class="card text-white bg-success p-3 text-center shadow">
        <h5>✅ Present Today</h5>
        <h2 th:text="${presentToday}">0</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-primary p-3 text-center shadow">
        <h5>📅 Today's Date</h5>
        <h5 th:text="${#temporals.format(#temporals.createNow(), 'dd-MM-yyyy')}"></h5>
      </div>
    </div>
    <div class="col-md-4">
      <a href="/attendance/mark"
         class="btn btn-success w-100 p-3 shadow" style="height:100%;">
        ✅ Mark Attendance
      </a>
    </div>
  </div>

  <!-- Employee List -->
  <div class="mt-4">
    <h5>👥 Employees — Monthly Attendance</h5>
    <table class="table table-bordered table-hover mt-2">
      <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Employee Name</th>
        <th>Department</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="emp, stat : ${employees}">
        <td th:text="${stat.index + 1}"></td>
        <td th:text="${emp.name}"></td>
        <td th:text="${emp.department}"></td>
        <td>
          <a th:href="@{/hr/attendance/employee/{id}(id=${emp.id})}"
             class="btn btn-sm btn-primary">
            📊 View Attendance
          </a>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="4" class="text-center text-muted">No employees found.</td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Logout -->
  <div class="mt-3">
    <form th:action="@{/logout}" method="post">
      <button type="submit" class="btn btn-outline-danger">🚪 Logout</button>
    </form>
  </div>

</div>
</body>
</html>
