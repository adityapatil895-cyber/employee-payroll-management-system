<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>HR Dashboard</title>
  <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
  <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

  <div th:replace="fragments/navbar :: sidebar"></div>

  <div id="content-wrapper" class="d-flex flex-column">
    <div id="content">

      <div th:replace="fragments/navbar :: topbar"></div>

      <div class="container-fluid">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
          <h1 class="h3 mb-0 text-gray-800">📋 HR Dashboard</h1>
        </div>

        <!-- Stats Cards -->
        <div class="row">
          <div class="col-xl-6 col-md-6 mb-4">
            <div class="card border-left-success shadow h-100 py-2">
              <div class="card-body">
                <div class="row no-gutters align-items-center">
                  <div class="col mr-2">
                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                      Present Today
                    </div>
                    <div class="h5 mb-0 font-weight-bold text-gray-800"
                         th:text="${presentToday}">0</div>
                  </div>
                  <div class="col-auto">
                    <i class="fas fa-user-check fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-xl-6 col-md-6 mb-4">
            <div class="card border-left-primary shadow h-100 py-2">
              <div class="card-body">
                <div class="row no-gutters align-items-center">
                  <div class="col mr-2">
                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                      Total Employees
                    </div>
                    <div class="h5 mb-0 font-weight-bold text-gray-800"
                         th:text="${employees.size()}">0</div>
                  </div>
                  <div class="col-auto">
                    <i class="fas fa-users fa-2x text-gray-300"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Employee Attendance Table -->
        <div class="card shadow mb-4">
          <div class="card-header py-3 d-flex justify-content-between align-items-center">
            <h6 class="m-0 font-weight-bold text-primary">👥 Employee Attendance</h6>
            <a href="/attendance/mark" class="btn btn-success btn-sm">
              <i class="fas fa-plus mr-1"></i>Mark Attendance
            </a>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                <thead class="thead-dark">
                <tr>
                  <th>#</th>
                  <th>Employee Name</th>
                  <th>Department</th>
                  <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp, stat : ${employees}">
                  <td th:text="${stat.index + 1}"></td>
                  <td th:text="${emp.name}"></td>
                  <td th:text="${emp.department}"></td>
                  <td>
                    <a th:href="@{/hr/attendance/employee/{id}(id=${emp.id})}"
                       class="btn btn-primary btn-sm">
                      <i class="fas fa-eye mr-1"></i>View Attendance
                    </a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(employees)}">
                  <td colspan="4" class="text-center text-muted">No employees found.</td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
