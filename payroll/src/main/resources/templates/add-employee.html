<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Employee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-5" style="max-width: 600px;">

  <div class="card shadow p-4">

    <h3 class="text-center mb-4">Add Employee</h3>

    <form th:action="@{/employees/save}" th:object="${employee}" method="post">

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" th:field="*{name}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" th:field="*{email}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Department</label>
        <input type="text" th:field="*{department}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Basic Salary</label>
        <input type="number" step="0.01" th:field="*{basicSalary}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Overtime Hours</label>
        <input type="number" th:field="*{overtimeHours}" class="form-control">
      </div>

      <!-- Buttons -->
      <div class="d-flex gap-2 justify-content-center mt-4">
        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/employees}" class="btn btn-secondary">← Back</a>
      </div>

    </form>

  </div>

</div>

</body>
</html>
