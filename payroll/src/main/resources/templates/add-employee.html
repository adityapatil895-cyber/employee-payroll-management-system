<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Add Employee</title>
  <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
  <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

  <div th:replace="fragments/navbar :: sidebar"></div>

  <div id="content-wrapper" class="d-flex flex-column">
    <div id="content">

      <div th:replace="fragments/navbar :: topbar"></div>

      <div class="container-fluid">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
          <h1 class="h3 mb-0 text-gray-800"> Add Employee</h1>
          <a href="/employees" class="btn btn-secondary">
            <i class="fas fa-arrow-left mr-2"></i>Back
          </a>
        </div>

        <div class="card shadow mb-4">
          <div class="card-body">
            <form th:action="@{/employees/save}" th:object="${employee}" method="post">

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" th:field="*{name}"
                           placeholder="Enter full name" required/>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" th:field="*{email}"
                           placeholder="Enter email" required/>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Department</label>
                    <input type="text" class="form-control" th:field="*{department}"
                           placeholder="Enter department" required/>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Basic Salary (₹)</label>
                    <input type="number" class="form-control" th:field="*{basicSalary}"
                           placeholder="Enter basic salary" required/>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Overtime Hours</label>
                    <input type="number" class="form-control" th:field="*{overtimeHours}"
                           placeholder="Enter overtime hours" value="0"/>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save mr-2"></i>Save Employee
              </button>
              <a href="/employees" class="btn btn-secondary ml-2">Cancel</a>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
