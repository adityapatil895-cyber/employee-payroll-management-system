<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Payslip</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

    <div th:replace="fragments/navbar :: sidebar"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div th:replace="fragments/navbar :: topbar"></div>

            <div class="container-fluid">

                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800"> Payslip</h1>
                    <div>
                        <button onclick="window.print()" class="btn btn-primary">
                            <i class="fas fa-print mr-2"></i>Print
                        </button>
                        <a th:href="@{/employees/{id}/payslip(id=${employee.id})}"
                           class="btn btn-success ml-2">
                            <i class="fas fa-file-pdf mr-2"></i>Download PDF
                        </a>
                        <a th:href="${role == 'ROLE_EMPLOYEE'} ? '/employee/dashboard' : '/payroll'"
                           class="btn btn-secondary ml-2">
                            <i class="fas fa-arrow-left mr-2"></i>Back
                        </a>
                    </div>
                </div>

                <div class="card shadow mb-4">

                    <div class="card-header bg-gradient-primary text-white text-center py-4">
                        <h4 class="font-weight-bold mb-1"> Employee Payroll Management System</h4>
                        <p class="mb-0">Monthly Payslip</p>
                    </div>

                    <div class="card-body">


                        <div class="row mb-4">
                            <div class="col-md-6">
                                <table class="table table-borderless">
                                    <tr>
                                        <td><strong>Name:</strong></td>
                                        <td th:text="${employee.name}"></td>
                                    </tr>
                                    <tr>
                                        <td><strong>Email:</strong></td>
                                        <td th:text="${employee.email}"></td>
                                    </tr>
                                    <tr>
                                        <td><strong>Department:</strong></td>
                                        <td th:text="${employee.department}"></td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <table class="table table-borderless">
                                    <tr>
                                        <td><strong>Employee ID:</strong></td>
                                        <td th:text="${employee.id}"></td>
                                    </tr>
                                    <tr>
                                        <td><strong>Overtime Hours:</strong></td>
                                        <td th:text="${employee.overtimeHours}"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col-md-6">
                                <h5 class="text-success font-weight-bold">
                                    <i class="fas fa-arrow-up mr-2"></i>Earnings
                                </h5>
                                <table class="table table-bordered">
                                    <tr>
                                        <td>Basic Salary</td>
                                        <td th:text="${'₹' + employee.basicSalary}"></td>
                                    </tr>
                                    <tr>
                                        <td>HRA (40%)</td>
                                        <td th:text="${'₹' + employee.hra}"></td>
                                    </tr>
                                    <tr>
                                        <td>Allowances (20%)</td>
                                        <td th:text="${'₹' + employee.allowances}"></td>
                                    </tr>
                                    <tr>
                                        <td>Overtime Pay</td>
                                        <td th:text="${'₹' + employee.overtimePay}"></td>
                                    </tr>
                                    <tr class="table-success">
                                        <td><strong>Gross Salary</strong></td>
                                        <td><strong th:text="${'₹' + employee.grossSalary}"></strong></td>
                                    </tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <h5 class="text-danger font-weight-bold">
                                    <i class="fas fa-arrow-down mr-2"></i>Deductions
                                </h5>
                                <table class="table table-bordered">
                                    <tr>
                                        <td>Provident Fund (12%)</td>
                                        <td th:text="${'₹' + employee.pf}"></td>
                                    </tr>
                                    <tr>
                                        <td>Income Tax (10%)</td>
                                        <td th:text="${'₹' + employee.tax}"></td>
                                    </tr>
                                    <tr class="table-danger">
                                        <td><strong>Total Deductions</strong></td>
                                        <td><strong th:text="${'₹' + (employee.pf + employee.tax)}"></strong></td>
                                    </tr>
                                </table>
                            </div>
                        </div>


                        <div class="alert alert-success text-center mt-3">
                            <h4 class="font-weight-bold">
                                 Net Salary:
                                <strong th:text="${'₹' + employee.netSalary}"></strong>
                            </h4>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
