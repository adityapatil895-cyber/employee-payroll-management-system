<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payroll List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h2> Payroll Management</h2>

    <a th:href="@{/admin/dashboard}" class="btn btn-outline-dark mb-3">← Back</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Employee</th>
            <th>Department</th>
            <th>Basic Salary</th>
            <th>HRA</th>
            <th>Allowances</th>
            <th>Overtime</th>
            <th>Gross Salary</th>
            <th>PF</th>
            <th>Tax</th>
            <th>Net Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp, stat : ${employees}">
            <td th:text="${stat.index + 1}"></td>
            <td th:text="${emp.name}"></td>
            <td th:text="${emp.department}"></td>
            <td th:text="${'₹' + emp.basicSalary}"></td>
            <td th:text="${'₹' + emp.hra}"></td>
            <td th:text="${'₹' + emp.allowances}"></td>
            <td th:text="${'₹' + emp.overtimePay}"></td>
            <td th:text="${'₹' + emp.grossSalary}"></td>
            <td th:text="${'₹' + emp.pf}"></td>
            <td th:text="${'₹' + emp.tax}"></td>
            <td>
                <strong th:text="${'₹' + emp.netSalary}"
                        class="text-success"></strong>
            </td>
            <td>
                <a th:href="@{/payroll/detail/{id}(id=${emp.id})}"
                   class="btn btn-sm btn-primary">View Payslip</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="12" class="text-center text-muted">No employees found.</td>
        </tr>
        </tbody>
    </table>

    <!-- Summary Cards -->
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary p-3 text-center">
                <h5>Total Employees</h5>
                <h3 th:text="${employees.size()}"></h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success p-3 text-center">
                <h5>Total Net Salary</h5>
                <h3 th:text="${'₹' + totalNetSalary}"></h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-danger p-3 text-center">
                <h5>Total Deductions</h5>
                <h3 th:text="${'₹' + totalDeductions}"></h3>
            </div>
        </div>
    </div>

</div>
</body>
</html>
