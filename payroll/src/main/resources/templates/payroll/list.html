<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Payroll</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

    <div th:replace="fragments/navbar :: sidebar"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div th:replace="fragments/navbar :: topbar"></div>

            <div class="container-fluid">

                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800"> Payroll Management</h1>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                <thead class="thead-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Employee</th>
                                    <th>Department</th>
                                    <th>Basic</th>
                                    <th>HRA</th>
                                    <th>Allowances</th>
                                    <th>Overtime</th>
                                    <th>Gross</th>
                                    <th>PF</th>
                                    <th>Tax</th>
                                    <th>Net Salary</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="emp, stat : ${employees}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${emp.name}"></td>
                                    <td th:text="${emp.department}"></td>
                                    <td th:text="${'₹' + emp.basicSalary}"></td>
                                    <td th:text="${'₹' + emp.hra}"></td>
                                    <td th:text="${'₹' + emp.allowances}"></td>
                                    <td th:text="${'₹' + emp.overtimePay}"></td>
                                    <td th:text="${'₹' + emp.grossSalary}"></td>
                                    <td th:text="${'₹' + emp.pf}"></td>
                                    <td th:text="${'₹' + emp.tax}"></td>
                                    <td>
                                        <strong class="text-success"
                                                th:text="${'₹' + emp.netSalary}"></strong>
                                    </td>
                                    <td>
                                        <a th:href="@{/payroll/detail/{id}(id=${emp.id})}"
                                           class="btn btn-info btn-sm">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/employees/{id}/payslip(id=${emp.id})}"
                                           class="btn btn-success btn-sm">
                                            <i class="fas fa-file-pdf"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(employees)}">
                                    <td colspan="12" class="text-center text-muted">No employees found.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
