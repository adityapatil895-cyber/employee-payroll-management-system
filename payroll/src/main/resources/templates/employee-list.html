<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Employee List</title>
  <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
  <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

  <div th:replace="fragments/navbar :: sidebar"></div>

  <div id="content-wrapper" class="d-flex flex-column">
    <div id="content">

      <div th:replace="fragments/navbar :: topbar"></div>

      <div class="container-fluid">

        <div class="d-sm-flex align-items-center justify-content-between mb-4">
          <h1 class="h3 mb-0 text-gray-800"> Employee Management</h1>
          <a href="/employees/add" class="btn btn-primary">
            <i class="fas fa-user-plus mr-2"></i>Add Employee
          </a>
        </div>

        <div class="card shadow mb-4">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                <thead class="thead-dark">
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th>Basic Salary</th>
                  <th>Net Salary</th>
                  <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp, stat : ${employees}">
                  <td th:text="${stat.index + 1}"></td>
                  <td th:text="${emp.name}"></td>
                  <td th:text="${emp.email}"></td>
                  <td th:text="${emp.department}"></td>
                  <td th:text="${'₹' + emp.basicSalary}"></td>
                  <td><strong th:text="${'₹' + emp.netSalary}" class="text-success"></strong></td>
                  <td>
                    <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                       class="btn btn-warning btn-sm">
                      <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this employee?')">
                      <i class="fas fa-trash"></i>
                    </a>
                    <a th:href="@{/payroll/detail/{id}(id=${emp.id})}"
                       class="btn btn-info btn-sm">
                      <i class="fas fa-eye"></i>
                    </a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(employees)}">
                  <td colspan="7" class="text-center text-muted">No employees found.</td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
