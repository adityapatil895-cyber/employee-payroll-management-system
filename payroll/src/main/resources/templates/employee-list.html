<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Employee List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>

<div class="container mt-4">

  <h2>Employee Records</h2>

  <!-- Top Buttons -->
  <div class="d-flex justify-content-between mb-3">

    <!-- Add Employee -->
    <a th:href="@{/employees/add}" class="btn btn-primary">
      + Add Employee
    </a>

    <!-- Back Button (Role Based) -->
    <div>
      <!-- Admin -->
      <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
         th:href="@{/admin/dashboard}"
         class="btn btn-outline-dark">
        ← Back
      </a>

      <!-- HR (optional) -->
      <a th:if="${#authorization.expression('hasRole(''HR'')')}"
         th:href="@{/hr/dashboard}"
         class="btn btn-outline-dark">
        ← Back
      </a>
    </div>

  </div>

  <!-- Table -->
  <table class="table table-bordered table-hover">

    <thead class="table-dark">
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Email</th>
      <th>Department</th>
      <th>Basic Salary</th>
      <th>HRA</th>
      <th>Allowances</th>
      <th>Tax</th>
      <th>PF</th>
      <th>Overtime</th>
      <th>Gross Salary</th>
      <th>Net Salary</th>
      <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="emp, stat : ${employees}">
      <td th:text="${stat.index + 1}"></td>
      <td th:text="${emp.name}"></td>
      <td th:text="${emp.email}"></td>
      <td th:text="${emp.department}"></td>

      <td th:text="${'₹' + emp.basicSalary}"></td>
      <td th:text="${'₹' + emp.hra}"></td>
      <td th:text="${'₹' + emp.allowances}"></td>
      <td th:text="${'₹' + emp.tax}"></td>
      <td th:text="${'₹' + emp.pf}"></td>
      <td th:text="${emp.overtimeHours}"></td>
      <td th:text="${'₹' + emp.grossSalary}"></td>

      <td>
        <strong class="text-success"
                th:text="${'₹' + emp.netSalary}"></strong>
      </td>

      <td>
        <div class="d-flex gap-2 flex-wrap">

          <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
             class="btn btn-sm btn-warning">
            Edit
          </a>

          <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
             class="btn btn-sm btn-danger"
             onclick="return confirm('Delete this employee?')">
            Delete
          </a>

          <a th:href="@{/employees/{id}/payslip(id=${emp.id})}"
             class="btn btn-sm btn-primary">
            PDF
          </a>

        </div>
      </td>
    </tr>

    <!-- Empty case -->
    <tr th:if="${#lists.isEmpty(employees)}">
      <td colspan="13" class="text-center text-muted">
        No employees found.
      </td>
    </tr>

    </tbody>

  </table>

</div>

</body>
</html>
