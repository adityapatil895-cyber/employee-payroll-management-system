<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2>🕐 Attendance Management</h2>
    <hr/>

    <!-- Action Buttons -->
    <div class="mb-3">
        <a th:href="@{/attendance/mark}" class="btn btn-success">+ Mark Attendance</a>
        <!-- Back button based on role -->
        <a th:href="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? '/admin/dashboard' : '/hr/dashboard'"
           class="btn btn-outline-dark ms-2">← Back</a>
    </div>

    <!-- Employee List -->
    <h5>👥 Employees</h5>
    <table class="table table-bordered table-hover mt-2">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Employee Name</th>
            <th>Department</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp, stat : ${employees}">
            <td th:text="${stat.index + 1}"></td>
            <td th:text="${emp.name}"></td>
            <td th:text="${emp.department}"></td>
            <td>
                <a th:href="@{/hr/attendance/employee/{id}(id=${emp.id})}"
                   class="btn btn-sm btn-primary">
                    📊 View Attendance
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="4" class="text-center text-muted">No employees found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
