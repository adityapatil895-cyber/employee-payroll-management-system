<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">

    <h2>Attendance Records</h2>

    <!-- Filter -->
    <form th:action="@{/attendance/filter}" method="get" class="d-flex gap-2 mb-3">

        <input type="date" name="date" class="form-control">

        <button type="submit" class="btn btn-secondary">
            Filter
        </button>

        <a th:href="@{/attendance}" class="btn btn-outline-secondary">
            Clear
        </a>

    </form>

    <!-- Back Button (ROLE BASED) -->
    <div class="mb-3">

        <!-- Admin -->
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
           th:href="@{/admin/dashboard}"
           class="btn btn-outline-dark">
            ← Back
        </a>

        <!-- HR -->
        <a th:if="${#authorization.expression('hasRole(''HR'')')}"
           th:href="@{/hr/dashboard}"
           class="btn btn-outline-dark">
            ← Back
        </a>

    </div>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Table -->
    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Employee</th>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>Status</th>
            <th>Remarks</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="a, stat : ${attendanceList}">
            <td th:text="${stat.index + 1}"></td>
            <td th:text="${a.employee.name}"></td>
            <td th:text="${a.date}"></td>

            <td th:text="${a.clockIn != null ? a.clockIn : '-'}"></td>
            <td th:text="${a.clockOut != null ? a.clockOut : '-'}"></td>

            <!-- Status -->
            <td>
        <span th:if="${a.status != null}"
              th:text="${a.status}"
              class="badge"
              th:classappend="
                ${a.status.name() == 'PRESENT'} ? ' bg-success' :
                (${a.status.name() == 'ABSENT'} ? ' bg-danger' :
                (${a.status.name() == 'HALF_DAY'} ? ' bg-warning' : ' bg-secondary'))">
        </span>

                <span th:if="${a.status == null}" class="badge bg-secondary">
          N/A
        </span>
            </td>

            <td th:text="${a.remarks != null ? a.remarks : '-'}"></td>

            <td>
                <a th:href="@{/attendance/edit/{id}(id=${a.id})}"
                   class="btn btn-sm btn-warning">Edit</a>

                <a th:href="@{/attendance/delete/{id}(id=${a.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete this record?')">
                    Delete
                </a>
            </td>
        </tr>

        <!-- Empty case -->
        <tr th:if="${#lists.isEmpty(attendanceList)}">
            <td colspan="8" class="text-center text-muted">
                No attendance records found.
            </td>
        </tr>

        </tbody>
    </table>

</div>
</body>
</html>
