<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Attendance List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
  <h2> Attendance Records </h2>

  <!-- Filter by date -->
  <form th:action="@{/attendance/filter}" method="get" class="d-flex gap-2 mb-3">
    <input type="date" name="date" class="form-control w-auto"/>
    <button type="submit" class="btn btn-secondary">Filter</button>
    <a th:href="@{/attendance}" class="btn btn-outline-secondary">Clear</a>
  </form>

  <a th:href="@{/attendance/mark}" class="btn btn-primary mb-3">+ Mark Attendance</a>
  <a th:href="@{/admin/dashboard}" class="btn btn-outline-dark mb-3">← Back</a>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
      <th>#</th>
      <th>Employee</th>
      <th>Date</th>
      <th>Clock In</th>
      <th>Clock Out</th>
      <th>Status</th>
      <th>Remarks</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="a, stat : ${attendanceList}">
      <td th:text="${stat.index + 1}"></td>
      <td th:text="${a.employee.name}"></td>
      <td th:text="${a.date}"></td>
      <td th:text="${a.clockIn != null ? a.clockIn : '-'}"></td>
      <td th:text="${a.clockOut != null ? a.clockOut : '-'}"></td>
      <td>
          <span th:if="${a.status != null}"
                th:text="${a.status}"
                class="badge"
                th:classappend="
          ${a.status.name() == 'PRESENT'} ? ' bg-success' :
          (${a.status.name() == 'ABSENT'} ? ' bg-danger' :
          (${a.status.name() == 'HALF_DAY'} ? ' bg-warning' : ' bg-secondary'))">
</span>

        <span th:if="${a.status == null}" class="badge bg-secondary">N/A</span>
      </td>
      <td th:text="${a.remarks != null ? a.remarks : '-'}"></td>
      <td>
        <a th:href="@{/attendance/edit/{id}(id=${a.id})}"
           class="btn btn-sm btn-warning">Edit</a>
        <a th:href="@{/attendance/delete/{id}(id=${a.id})}"
           class="btn btn-sm btn-danger"
           onclick="return confirm('Delete this record?')">Delete</a>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(attendanceList)}">
      <td colspan="8" class="text-center text-muted">No attendance records found.</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
