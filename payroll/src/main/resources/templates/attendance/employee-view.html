<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>My Attendance</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

    <div th:replace="fragments/navbar :: sidebar"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div th:replace="fragments/navbar :: topbar"></div>

            <div class="container-fluid">

                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">
                         My Attendance —
                        <span th:text="${employee != null ? employee.name : 'Employee'}"></span>
                    </h1>
                    <span class="badge badge-primary p-2"
                          th:text="${currentMonth}"></span>
                </div>

                <div th:if="${errorMessage}"
                     class="alert alert-warning" th:text="${errorMessage}"></div>


                <div class="row mb-4" th:if="${!#lists.isEmpty(attendanceList)}">
                    <div class="col-md-3">
                        <div class="card border-left-success shadow py-2">
                            <div class="card-body text-center">
                                <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Present</div>
                                <div class="h5 font-weight-bold"
                                     th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'PRESENT'])}">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card border-left-danger shadow py-2">
                            <div class="card-body text-center">
                                <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">Absent</div>
                                <div class="h5 font-weight-bold"
                                     th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'ABSENT'])}">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card border-left-warning shadow py-2">
                            <div class="card-body text-center">
                                <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Half Day</div>
                                <div class="h5 font-weight-bold"
                                     th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'HALF_DAY'])}">0</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card border-left-info shadow py-2">
                            <div class="card-body text-center">
                                <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Leave</div>
                                <div class="h5 font-weight-bold"
                                     th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'LEAVE'])}">0</div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="card shadow mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                <thead class="thead-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Date</th>
                                    <th>Clock In</th>
                                    <th>Clock Out</th>
                                    <th>Status</th>
                                    <th>Remarks</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="a, stat : ${attendanceList}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${a.date}"></td>
                                    <td th:text="${a.clockIn != null ? a.clockIn : '-'}"></td>
                                    <td th:text="${a.clockOut != null ? a.clockOut : '-'}"></td>
                                    <td>
                                            <span th:if="${a.status != null}"
                                                  th:text="${a.status}"
                                                  th:class="${a.status.name() == 'PRESENT'} ? 'badge badge-success' :
                                                            (${a.status.name() == 'ABSENT'} ? 'badge badge-danger' :
                                                            (${a.status.name() == 'HALF_DAY'} ? 'badge badge-warning' :
                                                            'badge badge-info'))">
                                            </span>
                                        <span th:if="${a.status == null}" class="badge badge-secondary">-</span>
                                    </td>
                                    <td th:text="${a.remarks != null ? a.remarks : '-'}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(attendanceList)}">
                                    <td colspan="6" class="text-center text-muted">No records this month.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
