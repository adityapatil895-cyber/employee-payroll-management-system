<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h2>🕐 My Attendance — <span th:text="${employee != null ? employee.name : 'Employee'}"></span></h2>
    <h5 class="text-muted">Month: <span th:text="${currentMonth}"></span></h5>

    <div th:if="${errorMessage}" class="alert alert-warning" th:text="${errorMessage}"></div>

    <a th:href="@{/employee/dashboard}" class="btn btn-outline-dark mb-3">← Back</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>Status</th>
            <th>Remarks</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a, stat : ${attendanceList}">
            <td th:text="${stat.index + 1}"></td>
            <td th:text="${a.date}"></td>
            <td th:text="${a.clockIn != null ? a.clockIn : '-'}"></td>
            <td th:text="${a.clockOut != null ? a.clockOut : '-'}"></td>
            <td>
          <span th:if="${a.status != null}"
                th:text="${a.status}"
                th:class="${a.status.name() == 'PRESENT'} ? 'badge bg-success' :
                          (${a.status.name() == 'ABSENT'} ? 'badge bg-danger' :
                          (${a.status.name() == 'HALF_DAY'} ? 'badge bg-warning' :
                          'badge bg-info'))">
          </span>
                <span th:if="${a.status == null}" class="badge bg-secondary">-</span>
            </td>
            <td th:text="${a.remarks != null ? a.remarks : '-'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(attendanceList)}">
            <td colspan="6" class="text-center text-muted">No attendance records this month.</td>
        </tr>
        </tbody>
    </table>

    <!-- Summary -->
    <div class="row mt-3" th:if="${!#lists.isEmpty(attendanceList)}">
        <div class="col-md-3">
            <div class="card bg-success text-white text-center p-2">
                <h6>Present</h6>
                <h4 th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'PRESENT'])}">0</h4>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-danger text-white text-center p-2">
                <h6>Absent</h6>
                <h4 th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'ABSENT'])}">0</h4>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-white text-center p-2">
                <h6>Half Day</h6>
                <h4 th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'HALF_DAY'])}">0</h4>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-white text-center p-2">
                <h6>Leave</h6>
                <h4 th:text="${#lists.size(attendanceList.?[status != null and status.name() == 'LEAVE'])}">0</h4>
            </div>
        </div>
    </div>

</div>
</body>
</html>
