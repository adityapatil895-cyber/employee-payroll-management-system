<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h2>🕐 My Attendance — <span th:text="${employee.name}"></span></h2>

    <a th:href="@{/employee/dashboard}" class="btn btn-outline-dark mb-3">← Back to Dashboard</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Date</th>
            <th>Clock In</th>
            <th>Clock Out</th>
            <th>Status</th>
            <th>Remarks</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a, stat : ${attendanceList}">
            <td th:text="${stat.index + 1}"></td>
            <td th:text="${a.date}"></td>
            <td th:text="${a.clockIn != null ? a.clockIn : '-'}"></td>
            <td th:text="${a.clockOut != null ? a.clockOut : '-'}"></td>
            <td>
          <span th:text="${a.status}"
                th:class="${a.status.name() == 'PRESENT'} ? 'badge bg-success' :
                          (${a.status.name() == 'ABSENT'} ? 'badge bg-danger' :
                          (${a.status.name() == 'HALF_DAY'} ? 'badge bg-warning' : 'badge bg-info'))">
          </span>
            </td>
            <td th:text="${a.remarks != null ? a.remarks : '-'}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(attendanceList)}">
            <td colspan="6" class="text-center text-muted">No attendance records found.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
