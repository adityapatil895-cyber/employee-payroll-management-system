<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Edit Attendance</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body id="page-top">
<div id="wrapper">

    <div th:replace="fragments/navbar :: sidebar"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div th:replace="fragments/navbar :: topbar"></div>

            <div class="container-fluid">

                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">✏️ Edit Attendance</h1>


                    <a th:href="@{/hr/attendance/employee/{id}(id=${employeeId})}"
                       class="btn btn-secondary">
                        ← Back
                    </a>
                </div>

                <div class="card shadow mb-4" style="max-width: 700px;">
                    <div class="card-body">


                        <form th:action="@{/attendance/edit/{id}(id=${attendance.id})}"
                              th:object="${attendance}"
                              method="post"
                              id="editForm">


                            <div class="form-group">
                                <label>Employee <span class="text-danger">*</span></label>
                                <select id="employee" class="form-control" th:field="*{employee}" required>
                                    <option value="">-- Select Employee --</option>
                                    <option th:each="emp : ${employees}"
                                            th:value="${emp.id}"
                                            th:text="${emp.name}"></option>
                                </select>
                            </div>


                            <div class="form-group">
                                <label>Date <span class="text-danger">*</span></label>
                                <input id="date" type="date" class="form-control"
                                       th:field="*{date}" required/>
                            </div>


                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Clock In Time</label>
                                        <input type="time" class="form-control" th:field="*{clockIn}"/>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label>Clock Out Time</label>
                                        <input type="time" class="form-control" th:field="*{clockOut}"/>
                                    </div>
                                </div>
                            </div>


                            <div class="form-group">
                                <label>Status <span class="text-danger">*</span></label>
                                <select id="status" class="form-control" th:field="*{status}" required>
                                    <option value="">-- Select Status --</option>
                                    <option th:each="s : ${statuses}"
                                            th:value="${s}" th:text="${s}"></option>
                                </select>
                            </div>


                            <div class="form-group">
                                <label>Remarks</label>
                                <input type="text" class="form-control"
                                       th:field="*{remarks}" placeholder="Optional notes"/>
                            </div>


                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save mr-2"></i>Update
                            </button>


                            <a th:href="@{/hr/attendance/employee/{id}(id=${employeeId})}"
                               class="btn btn-secondary ml-2">Cancel</a>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>


<script>
    document.getElementById('editForm').addEventListener('submit', function(e) {

        var employee = document.getElementById('employee').value;
        var date = document.getElementById('date').value;
        var status = document.getElementById('status').value;

        if (!employee || !date || !status) {
            e.preventDefault();

            if (!employee) alert('⚠️ Please select an Employee!');
            else if (!date) alert('⚠️ Please select a Date!');
            else if (!status) alert('⚠️ Please select a Status!');

            return false;
        }
    });
</script>

</body>
</html>
