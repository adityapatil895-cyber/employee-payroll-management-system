<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Attendance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4" style="max-width: 600px;">
    <h2> Edit Attendance </h2>

    <form th:action="@{/attendance/edit/{id}(id=${attendance.id})}"
          th:object="${attendance}" method="post">

        <div class="mb-3">
            <label class="form-label">Employee</label>
            <select class="form-select" th:field="*{employee}">
                <option th:each="emp : ${employees}"
                        th:value="${emp.id}"
                        th:text="${emp.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" th:field="*{date}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Clock In Time</label>
            <input type="time" class="form-control" th:field="*{clockIn}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Clock Out Time</label>
            <input type="time" class="form-control" th:field="*{clockOut}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option th:each="s : ${statuses}"
                        th:value="${s}"
                        th:text="${s}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Remarks</label>
            <input type="text" class="form-control"
                   th:field="*{remarks}" placeholder="Optional notes"/>
        </div>

        <button type="submit" class="btn btn-warning">Update</button>
        <a th:href="@{/attendance}" class="btn btn-secondary">Cancel</a>

    </form>
</div>
</body>
</html>
