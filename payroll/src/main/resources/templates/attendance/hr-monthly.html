<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Monthly Attendance</title>
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">

    <div th:replace="fragments/navbar :: sidebar"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div th:replace="fragments/navbar :: topbar"></div>

            <div class="container-fluid">

                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800">
                        📊 Monthly Attendance —
                        <span th:text="${currentMonth}"></span>
                    </h1>
                    <a href="/attendance" class="btn btn-secondary">
                        <i class="fas fa-arrow-left mr-2"></i>Back
                    </a>
                </div>

                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between">
                        <h6 class="m-0 font-weight-bold text-primary">Attendance Records</h6>
                        <a href="/attendance/mark" class="btn btn-success btn-sm">
                            <i class="fas fa-plus mr-1"></i>Mark Attendance
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                <thead class="thead-dark">
                                <tr>
                                    <th>#</th>
                                    <th>Employee</th>
                                    <th>Date</th>
                                    <th>Clock In</th>
                                    <th>Clock Out</th>
                                    <th>Status</th>
                                    <th>Remarks</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="a, stat : ${attendanceList}">
                                    <td th:text="${stat.index + 1}"></td>
                                    <td th:text="${a.employee.name}"></td>
                                    <td th:text="${a.date}"></td>
                                    <td th:text="${a.clockIn != null ? a.clockIn : '-'}"></td>
                                    <td th:text="${a.clockOut != null ? a.clockOut : '-'}"></td>
                                    <td>
                                            <span th:if="${a.status != null}"
                                                  th:text="${a.status}"
                                                  th:class="${a.status.name() == 'PRESENT'} ? 'badge badge-success' :
                                                            (${a.status.name() == 'ABSENT'} ? 'badge badge-danger' :
                                                            (${a.status.name() == 'HALF_DAY'} ? 'badge badge-warning' :
                                                            'badge badge-info'))">
                                            </span>
                                        <span th:if="${a.status == null}" class="badge badge-secondary">-</span>
                                    </td>
                                    <td th:text="${a.remarks != null ? a.remarks : '-'}"></td>
                                    <td>
                                        <a th:href="@{/attendance/edit/{id}(id=${a.id})}"
                                           class="btn btn-warning btn-sm">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(attendanceList)}">
                                    <td colspan="8" class="text-center text-muted">No records found.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
