<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login | Payroll System</title>

    <!-- Custom fonts -->
    <link href="/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- SB Admin CSS -->
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">
                    <div class="row">

                        <!-- Left Side Image -->
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"
                             style="background: linear-gradient(135deg, #4e73df, #224abe);
                                    display:flex; align-items:center;
                                    justify-content:center; padding: 40px;">
                            <div class="text-center text-white">
                                <i class="fas fa-money-check-alt fa-5x mb-4"></i>
                                <h2 class="font-weight-bold">Payroll System</h2>
                                <p>Manage employees, attendance and payroll efficiently</p>
                            </div>
                        </div>

                        <!-- Right Side Form -->
                        <div class="col-lg-6">
                            <div class="p-5">
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Welcome Back!</h1>
                                </div>

                                <!-- Error Message -->
                                <div th:if="${param.error}"
                                     class="alert alert-danger text-center" role="alert">
                                    ❌ Invalid username or password!
                                </div>

                                <!-- Logout Message -->
                                <div th:if="${param.logout}"
                                     class="alert alert-success text-center" role="alert">
                                    ✅ Logged out successfully!
                                </div>

                                <form class="user" th:action="@{/login}" method="post">

                                    <div class="form-group">
                                        <input type="text" name="username"
                                               class="form-control form-control-user"
                                               placeholder="Enter Username..." required/>
                                    </div>

                                    <div class="form-group">
                                        <input type="password" name="password"
                                               class="form-control form-control-user"
                                               placeholder="Enter Password..." required/>
                                    </div>

                                    <button type="submit"
                                            class="btn btn-primary btn-user btn-block">
                                        Login
                                    </button>

                                </form>

                                <hr>
                                <div class="text-center">
                                    <small class="text-muted">
                                        Employee Payroll Management System
                                    </small>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="/js/sb-admin-2.min.js"></script>
</body>
</html>
